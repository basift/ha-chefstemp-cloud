# ChefsTemp — example Lovelace dashboard (the "Backyard ChefsTemp" view).
#
# This is the dashboard we actually use to monitor and drive the grill from Home
# Assistant: grill ambient, probe temperature/battery, stand battery, the fan
# thermostat enable, the fan target setpoint, the grill high/low alarms, the
# Bluetooth release switch, and the temperature-unit toggle.
#
# How to use it:
#   - Lovelace > Edit dashboard > (three dots) Raw configuration editor, and add
#     this as a view; OR paste the `cards:` into an existing view.
#   - Requires two HACS *frontend* cards: "button-card" and "card-mod".
#   - Entity IDs below are from one specific stand (mllngo / backyard_mllngo).
#     Replace them with your own (the integration names them after your stand).
#   - `switch.*_bluetooth` and `switch.*_show_temperature_in_degc` come from this
#     integration. `input_number.chefstemp_probe_target` and the
#     `input_boolean.chefstemp_*_alert` helpers are optional user helpers for a
#     phone "watch" alarm; drop those cards if you do not use them.
#   - The hero card references /local/chefstemp_dashboard_icon.jpg (optional).

title: ChefsTemp
path: back_yard_chefstemp
icon: mdi:thermometer-bluetooth
subview: true
back_path: /home-dash/back_yard
cards:
- type: vertical-stack
  cards:
  - type: heading
    heading: Back Yard · ChefsTemp
    heading_style: title
    icon: mdi:grill-outline
    card_mod:
      style: ha-card{--ha-heading-card-title-font-size:22px;--ha-heading-card-title-color:#e8f0ff;--ha-heading-card-icon-color:#4aa3ff;}
  - type: vertical-stack
    card_mod:
      style: :host{display:block;background:linear-gradient(180deg,rgba(14,28,52,.95),rgba(9,18,34,.95));border:1px
        solid rgba(80,130,200,.22);border-radius:22px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.35);--vertical-stack-card-gap:12px;}
    cards:
    - type: custom:button-card
      name: ChefsTemp
      entity_picture: /local/chefstemp_dashboard_icon.jpg
      show_entity_picture: true
      show_icon: false
      show_state: false
      show_label: true
      label: Grill thermometer
      layout: icon_name_state2nd
      tap_action:
        action: none
      styles:
        card:
        - padding: 12px
        - border-radius: 16px
        - height: 120px
        - background: linear-gradient(100deg,#0b2a55 0%,#0e3a74 45%,#0a1d3c 100%)
        - border: 1px solid rgba(90,150,230,.35)
        - box-shadow: none
        grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 110px 1fr
        img_cell:
        - width: 100px
        - height: 100px
        icon:
        - width: 100px
        - height: 100px
        - border-radius: 12px
        name:
        - justify-self: start
        - font-size: 30px
        - font-weight: '700'
        - color: '#fff'
        - align-self: end
        label:
        - justify-self: start
        - font-size: 20px
        - color: '#8fb0d8'
        - align-self: start
    - type: markdown
      content: '{% set grill = states(''sensor.mllngo_grill_temperature'') %}{% set probe = states(''sensor.backyard_mllngo_probe_1_temperature'')
        %}

        ## <ha-icon icon="{{ ''mdi:alert'' if grill | is_number == false else ''mdi:grill'' }}"></ha-icon>
        {{ ''Grill '' ~ grill ~ ''°F'' if grill | is_number else ''Grill temperature unavailable'' }}

        {% if probe | is_number %}Probe 1: {{ probe }}°F{% else %}Probe 1 is disconnected or not reporting.{%
        endif %}


        <ha-icon icon="mdi:fan"></ha-icon> **Fan thermostat:** {{ ''Enabled'' if is_state(''fan.mllngo_fan'',''on'')
        else ''Disabled'' if is_state(''fan.mllngo_fan'',''off'') else ''Unavailable'' }}'
      card_mod:
        style:
          .: ha-card{ {% set bad = not states('sensor.mllngo_grill_temperature') | is_number %}background:{{
            'linear-gradient(180deg,rgba(70,42,10,.55),rgba(40,24,8,.55))' if bad else 'rgba(18,36,68,.55)'
            }};border:1px solid {{ 'rgba(255,160,40,.55)' if bad else 'rgba(90,140,210,.22)' }};border-radius:14px;box-shadow:none;}
          ha-markdown$: 'h2{margin:0 0 6px;font-size:22px;color:#fff;}

            ha-icon{--mdc-icon-size:34px;color:{{ ''#ffb020'' if not states(''sensor.mllngo_grill_temperature'')
            | is_number else ''#4aa3ff'' }};vertical-align:middle;margin-right:10px;}

            p{margin:4px 0;color:#c4d3ea;}

            p ha-icon{--mdc-icon-size:26px;color:#9fb4d4;margin-right:12px;}

            p strong{color:#fff;}'
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        color: blue
        card_mod:
          style:
            .: ha-card{background:rgba(18,36,68,.55);border:1px solid rgba(90,140,210,.22);border-radius:14px;box-shadow:none;}
            ha-tile-icon$: .shape{border-radius:12px !important;}
        entity: sensor.mllngo_grill_temperature
        name: Grill ambient
        icon: mdi:thermometer
      - type: tile
        color: blue
        card_mod:
          style:
            .: ha-card{background:rgba(18,36,68,.55);border:1px solid rgba(90,140,210,.22);border-radius:14px;box-shadow:none;}
            ha-tile-icon$: .shape{border-radius:12px !important;}
        entity: sensor.mllngo_stand_battery
        name: Stand battery
        icon: mdi:battery
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.backyard_mllngo_probe_1_temperature
        state_not: unavailable
      - condition: state
        entity: sensor.backyard_mllngo_probe_1_temperature
        state_not: unknown
      card:
        type: grid
        columns: 2
        square: false
        cards:
        - type: tile
          entity: sensor.backyard_mllngo_probe_1_temperature
          name: Probe 1
          icon: mdi:thermometer-probe
          color: blue
          card_mod:
            style:
              .: ha-card{background:rgba(18,36,68,.55);border:1px solid rgba(90,140,210,.22);border-radius:14px;box-shadow:none;}
              ha-tile-icon$: .shape{border-radius:12px !important;}
        - type: tile
          entity: sensor.backyard_mllngo_probe_1_battery
          name: Probe 1 battery
          icon: mdi:battery
          color: blue
          card_mod:
            style:
              .: ha-card{background:rgba(18,36,68,.55);border:1px solid rgba(90,140,210,.22);border-radius:14px;box-shadow:none;}
              ha-tile-icon$: .shape{border-radius:12px !important;}
